extra:
  # Sans ce réglage, le logo/titre dans l'en-tête renvoie vers la racine de la
  # doc (site_url ci-dessus, /docs/) — aucun lien retour vers l'app elle-même.
  # Documenté dans Material for MkDocs : "Setting the homepage URL".
  homepage: https://fitradarhr.fr/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adams43360/FitRadarHR

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

docs_dir: docs/user

nav:
  - Accueil: index.md
  - Prise en main:
    - getting-started/index.md
    - Essayer la démo: getting-started/demo.md
    - Créer un compte: getting-started/signup.md
    - Tableau de bord: getting-started/dashboard.md
    - Connexion SSO (Keycloak/OIDC): getting-started/sso.md
    - API publique: getting-started/api.md
    - Plan gratuit et abonnement: getting-started/billing.md
  - Départements:
    - departments/index.md
  - Postes:
    - positions/index.md
    - Créer un poste: positions/create.md
    - Définir le profil cible: positions/profile.md
  - Équipes:
    - teams/index.md
    - Créer une équipe: teams/create.md
    - Gérer les membres: teams/members.md
  - Questionnaire Big Five:
    - survey/index.md
    - Envoyer un lien: survey/send.md
    - Suivre la progression: survey/track.md
  - Rapports de Fit:
    - reports/index.md
    - Fit Poste: reports/job-fit.md
    - Fit Équipe: reports/team-fit.md
    - Cartographie des manques d'équipe: reports/team-gaps.md
    - Exporter en PDF: reports/export.md
    - Analytics: reports/analytics.md
  - À propos:
    - about/big-five.md
    - Big Five vs MBTI: about/big-five-vs-mbti.md
    - EU AI Act et recrutement: about/eu-ai-act.md
    - Roadmap: about/roadmap.md
    - about/privacy.md
    - about/license.md
