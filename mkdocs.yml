site_name: FitRadarHR
site_description: Évaluez la compatibilité Big Five entre une personne et un poste ou une équipe.
# Migrée depuis GitHub Pages (adams43360.github.io/FitRadarHR) vers fitradarhr.fr/docs/
# le 2026-08-07 — consolide l'autorité SEO sur le domaine principal plutôt que de la
# répartir sur deux propriétés distinctes. Construite au démarrage du conteneur `app`
# et servie par nginx (voir docker/nginx.prod.conf, docker-compose.prod.yml).
site_url: https://fitradarhr.fr/docs/
repo_url: https://github.com/adams43360/FitRadarHR
repo_name: FitRadarHR
edit_uri: edit/main/docs/user/

theme:
  name: material
  language: fr
  logo: assets/logo.png
  favicon: assets/logo.png
  # overrides/main.html injecte le JSON-LD Organization (voir ce fichier) —
  # même schéma que celui sitewide sur l'app Django (core/context_processors.py::seo).
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy

plugins:
  - search:
      lang:
        - fr
        - en
        - es
        - de
  # Parité avec le produit (FR/EN/ES/DE) — ajoutée le 2026-08-07. Structure
  # "suffix" : chaque page est un fichier par langue (index.fr.md, index.en.md...),
  # voir docs/user/**. Le FR reste la langue par défaut, construite à la racine
  # /docs/ (aucun changement d'URL pour les pages déjà indexées) ; EN/ES/DE sont
  # construits sous /docs/en/, /docs/es/, /docs/de/.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
          nav_translations:
            Accueil: Accueil
            Prise en main: Prise en main
            Essayer la démo: Essayer la démo
            Créer un compte: Créer un compte
            Tableau de bord: Tableau de bord
            Connexion SSO (Keycloak/OIDC): Connexion SSO (Keycloak/OIDC)
            API publique: API publique
            Plan gratuit et abonnement: Plan gratuit et abonnement
            Départements: Départements
            Postes: Postes
            Créer un poste: Créer un poste
            Définir le profil cible: Définir le profil cible
            Équipes: Équipes
            Créer une équipe: Créer une équipe
            Gérer les membres: Gérer les membres
            Questionnaire Big Five: Questionnaire Big Five
            Envoyer un lien: Envoyer un lien
            Suivre la progression: Suivre la progression
            Rapports de Fit: Rapports de Fit
            Fit Poste: Fit Poste
            Fit Équipe: Fit Équipe
            Cartographie des manques d'équipe: Cartographie des manques d'équipe
            Exporter en PDF: Exporter en PDF
            Analytics: Analytics
            À propos: À propos
            Big Five vs MBTI: Big Five vs MBTI
            EU AI Act et recrutement: EU AI Act et recrutement
            Roadmap: Roadmap
          admonition_translations:
            note: Note
            tip: Astuce
            info: Info
            warning: Avertissement
            danger: Attention
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
