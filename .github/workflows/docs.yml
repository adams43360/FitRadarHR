name: Documentation build check

# Jusqu'au 2026-08-07, ce workflow publiait la doc sur GitHub Pages. La doc est
# désormais construite et servie directement par fitradarhr.fr/docs/ à chaque
# déploiement (docker/docker-compose.prod.yml — mkdocs build au démarrage du
# conteneur, servi par nginx). Publier au même endroit ET sur GitHub Pages
# créerait du contenu dupliqué (mauvais pour le SEO) ; ce workflow ne fait donc
# plus que vérifier que la doc se construit sans erreur, en CI.
#
# GitHub Pages doit être désactivé manuellement dans Settings → Pages du dépôt
# (pas faisable depuis un workflow) pour que l'ancienne URL cesse de répondre.

on:
  push:
    branches:
      - main
    paths:
      - "docs/user/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    paths:
      - "docs/user/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site (fails the check if a page is broken)
        run: mkdocs build --strict
